name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -o TrayectoriaTiros-v2-Correcto.zip -d proyecto

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrayectoriaTiros-v2-debug-apk
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
