name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto
        run: |
          unzip -o TrayectoriaTiros-v2-Directo.zip -d proyecto
          find proyecto -type f -name "settings.gradle.kts" -exec dirname {} \; | head -1

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto -type f -name 'settings.gradle.kts' | head -1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrayectoriaTiros-v2-debug-apk
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
